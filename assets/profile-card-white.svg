<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&amp;display=swap');

      .bg { fill: #ffffff; rx: 12px; }
      
      text {
        font-family: 'Fira Code', monospace, Consolas, 'Courier New';
        font-size: 11px;
        white-space: pre;
      }

      /* Animated Glowing Outer Border for Light Mode */
      .cyber-border {
        fill: none;
        stroke: #0969da;
        stroke-width: 1.5;
        rx: 12px;
        animation: borderPulse 4s infinite alternate ease-in-out;
      }

      @keyframes borderPulse {
        0% { stroke: #0969da; filter: drop-shadow(0 0 2px rgba(9,105,218,0.2)); }
        50% { stroke: #8250df; filter: drop-shadow(0 0 6px rgba(130,80,223,0.3)); }
        100% { stroke: #1a7f37; filter: drop-shadow(0 0 4px rgba(26,127,55,0.25)); }
      }

      /* ASCII Text Gradient Base */
      .ascii-text {
        font-size: 10.5px;
      }

      /* Portrait Label Underneath Image */
      .portrait-label-bg {
        fill: #f6f8fa;
        stroke: #d0d7de;
        stroke-width: 1;
        rx: 6px;
      }

      .portrait-label-text {
        fill: #0969da;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-anchor: middle;
      }

      /* Radar Scan Line Effect */
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(300px); opacity: 0; }
      }

      .radar-sweep {
        width: 420px;
        height: 2px;
        fill: url(#radarGrad);
        animation: scanline 3.5s infinite linear;
        animation-delay: 1.2s;
      }

      /* Terminal UI & Text Styles */
      .prompt { fill: #1a7f37; font-weight: 700; }
      .path { fill: #0969da; font-weight: 700; }
      .cmd { fill: #bc4c00; font-weight: 500; }
      
      .glitch-title {
        fill: #1f2328;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
        filter: drop-shadow(0 0 4px rgba(31, 35, 40, 0.15));
      }

      .subtitle { fill: #636c76; font-size: 12px; }

      /* Glowing Cursor */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        fill: #0969da;
        animation: blink 0.9s infinite;
      }

      /* Skill Badge Styles */
      .cat-title { fill: #8250df; font-size: 12px; font-weight: 700; }
      .skill-tag { fill: #1f2328; font-size: 11px; }
      .skill-bullet { fill: #cf222e; font-weight: bold; }
      
      .badge-bg {
        fill: #f6f8fa;
        stroke: #d0d7de;
        stroke-width: 1;
        rx: 6px;
      }

      /* Slide-In Animation for Skill Groups */
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(25px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .skill-anim-1 { animation: slideIn 0.5s ease-out forwards 1.1s; opacity: 0; }
      .skill-anim-2 { animation: slideIn 0.5s ease-out forwards 1.4s; opacity: 0; }
      .skill-anim-3 { animation: slideIn 0.5s ease-out forwards 1.7s; opacity: 0; }

    </style>

    <!-- Radar Line Gradient (Light Mode Palette) -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0" />
      <stop offset="50%" stop-color="#0969da" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8250df" stop-opacity="0" />
    </linearGradient>

    <!-- High-Contrast Gradient for ASCII Art -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="50%" stop-color="#116329" />
      <stop offset="100%" stop-color="#8250df" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect class="bg" width="920" height="480" />
  
  <!-- Cyber Animated Border -->
  <rect class="cyber-border" width="918" height="478" x="1" y="1" />

  <!-- Terminal Window Control Bar -->
  <g transform="translate(0,0)">
    <circle cx="25" cy="22" r="5.5" fill="#ff5f56" />
    <circle cx="43" cy="22" r="5.5" fill="#ffbd2e" />
    <circle cx="61" cy="22" r="5.5" fill="#27c93f" />
    <text x="85" y="26" fill="#636c76" font-size="11">system@marwan-gamal: ~/portfolio/skills</text>
    <line x1="0" y1="40" x2="920" y2="40" stroke="#d0d7de" stroke-width="1" />
  </g>

