      <text class="portrait-label-text" x="190" y="20">Applied AI Engineer</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Terminal Header & Skills Stack -->
  <g transform="translate(480, 60)">
    <!-- Active Prompt Command -->
    <text x="0" y="20">
      <tspan class="prompt">guest@marwan-dev</tspan><tspan fill="#1f2328">:</tspan><tspan class="path">~</tspan><tspan fill="#1f2328">$ </tspan><tspan class="cmd">./fetch_stack.sh --full</tspan><rect class="cursor" x="320" y="8" width="7" height="15" />
    </text>

    <!-- Header Title Block -->
