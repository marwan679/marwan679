    <!-- Badge Label Underneath ASCII Portrait -->
    <g transform="translate(18, 320)">
      <rect class="portrait-label-bg" x="0" y="0" width="380" height="32" rx="6" />
      <text class="portrait-label-text" x="190" y="20">Applied AI Engineer</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Terminal Header &amp; Skills Stack -->
  <g transform="translate(480, 60)">
    <!-- Active Prompt Command -->
    <text x="0" y="20">
      <tspan class="prompt">guest@marwan-dev</tspan><tspan fill="#1f2328">:</tspan><tspan class="path">~</tspan><tspan fill="#1f2328">$ </tspan><tspan class="cmd">./fetch_stack.sh --full</tspan><rect class="cursor" x="320" y="8" width="7" height="15" />
    </text>

    <!-- Header Title Block -->
    <text class="glitch-title" x="0" y="55">Marwan Gamal</text>
    <text class="subtitle" x="0" y="74">Applied AI Specialist &amp; Research Engineer</text>
    <line x1="0" y1="85" x2="410" y2="85" stroke="#d0d7de" stroke-width="1.5" />

    <!-- Group 1: Core AI &amp; Deep Learning -->
    <g transform="translate(0, 105)">
      <g class="skill-anim-1">
        <text class="cat-title" x="0" y="0">⚡ Core AI &amp; Deep Learning</text>

        <rect class="badge-bg" x="0" y="10" width="195" height="26" rx="6" />
        <text class="skill-tag" x="10" y="27"><tspan class="skill-bullet">›</tspan> PyTorch | TensorFlow</text>

        <rect class="badge-bg" x="205" y="10" width="195" height="26" rx="6" />
        <text class="skill-tag" x="215" y="27"><tspan class="skill-bullet">›</tspan> LLM Orchestration</text>

        <rect class="badge-bg" x="0" y="42" width="195" height="26" rx="6" />
        <text class="skill-tag" x="10" y="59"><tspan class="skill-bullet">›</tspan> Quantization (GGUF)</text>

        <rect class="badge-bg" x="205" y="42" width="195" height="26" rx="6" />
        <text class="skill-tag" x="215" y="59"><tspan class="skill-bullet">›</tspan> LangChain &amp; Agents</text>
      </g>
    </g>

    <!-- Group 2: Vision &amp; Speech -->
    <g transform="translate(0, 205)">
      <g class="skill-anim-2">
        <text class="cat-title" x="0" y="0">👁️ Vision &amp; Speech Intelligence</text>

        <rect class="badge-bg" x="0" y="10" width="195" height="26" rx="6" />
        <text class="skill-tag" x="10" y="27"><tspan class="skill-bullet">›</tspan> OpenCV | MediaPipe</text>

        <rect class="badge-bg" x="205" y="10" width="195" height="26" rx="6" />
        <text class="skill-tag" x="215" y="27"><tspan class="skill-bullet">›</tspan> YOLO Tracking &amp; AR</text>

        <rect class="badge-bg" x="0" y="42" width="195" height="26" rx="6" />
        <text class="skill-tag" x="10" y="59"><tspan class="skill-bullet">›</tspan> Automatic Speech (ASR)</text>

        <rect class="badge-bg" x="205" y="42" width="195" height="26" rx="6" />
        <text class="skill-tag" x="215" y="59"><tspan class="skill-bullet">›</tspan> Signal Processing</text>
      </g>
    </g>

    <!-- Group 3: Deployment &amp; Data Science -->
    <g transform="translate(0, 305)">
      <g class="skill-anim-3">
        <text class="cat-title" x="0" y="0">⚙️ Deployment &amp; Data Engineering</text>

        <rect class="badge-bg" x="0" y="10" width="195" height="26" rx="6" />
        <text class="skill-tag" x="10" y="27"><tspan class="skill-bullet">›</tspan> BERTopic &amp; Clustering</text>

        <rect class="badge-bg" x="205" y="10" width="195" height="26" rx="6" />
